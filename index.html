<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Cobros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>Mis Cobros</span></div>
    <nav>
      <button class="nav-btn active" data-view="dashboard">Inicio</button>
      <button class="nav-btn" data-view="clients">Clientes</button>
      <button class="nav-btn" data-view="payments">Pagos</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Inicio</h1>
        <p id="today"></p>
      </div>
      <button class="primary" id="quick-payment">+ Registrar pago</button>
    </header>

    <section id="app"></section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="close-modal">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
